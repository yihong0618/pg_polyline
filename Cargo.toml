[package]
name = "pg_polyline"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []

[dependencies]
pgrx = "=0.20.1"
geo-types = "0.7.8"
# This is a fork of the original polyline crate that fix the encoding/decoding error
polyline = { git = "https://github.com/mattiZed/polyline.git", branch = "refactor/encode-decode-via-LUT" }

[dev-dependencies]
pgrx-tests = "=0.20.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
